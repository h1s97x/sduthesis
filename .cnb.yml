# CNB 流水线配置
# 1. Git Sync：每次 push 到 main 后，自动将代码同步到 GitHub（h1s97x/sduthesis）
#    使用官方 tencentcom/git-sync 插件 + sync_mode: rebase（Rebase 模式），
#    HTTPS + Access Token 认证。参考 https://cnb.cool/cnb/plugins/tencentcom/git-sync
#    敏感信息（GITHUB_USERNAME / GITHUB_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用。
# 2. 手动触发（Web Trigger）：从 GitHub 拉取最新提交到 CNB（GitHub → CNB）
#    使用官方插件 sync_mode: pull，按钮见 .cnb/web_trigger.yml，事件挂靠在 $ 兜底分支下。
# 3. Issue / PR 自动分配处理人 / 审查人：创建后自动将处理人、审查人设置为仓库维护者。
# 注意：不要用 `.` 开头的 key 存引用源（如 `.maintainer`）——CNB 会把以 `.` 开头的 key
# 当作 !reference 引用源，Schema 强制其为 array/object，字符串会触发 Schema 校验失败、
# 导致整个 .cnb.yml 无效。维护者直接内联，换维护者时统一改下方三处（issue / pr assignee / pr reviewer）。

main:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/sduthesis.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            push_tags: true
            # Rebase 模式：保留 GitHub 仓库特有的平台文件（如 .github/workflows/*.yml），
            # 同时避免无条件 force 覆盖 GitHub 远端的新提交。
            sync_mode: rebase

  # PR 创建后自动分配处理人和审查人
  # 使用 git:reviewer 内置任务（无需脚本、自动注入鉴权）。
  # 事件放目标分支（main）下，pull_request.target 用目标分支代码执行、且不校验触发者权限，
  # 对跨仓协作者提交更友好。
  #   处理人：type: add-assignee
  #   审查人：type: add-reviewer-from-repo-members（从仓库成员中随机选一名评审人）
  pull_request.target:
    - name: auto-assign-pr-owner
      env:
        PR_REVIEWER: h1s97x
      stages:
        - name: assign pr to owner
          type: git:reviewer
          options:
            type: add-assignee
            reviewers: ${PR_REVIEWER}
        - name: add pr reviewer
          type: git:reviewer
          options:
            type: add-reviewer-from-repo-members

# 兜底分支：web_trigger / issue.* / tag_push 等事件
$:
  # 手动触发：从 GitHub 拉取（GitHub → CNB，新增）
  # 使用官方 tencentcom/git-sync 插件 + sync_mode: pull（Pull 模式），
  # 参考 https://cnb.cool/cnb/plugins/tencentcom/git-sync
  web_trigger_pull_from_github:
    - name: web-trigger-pull-from-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: pull from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/sduthesis.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            sync_mode: pull

  # Issue 创建后自动分配处理人
  # 使用官方 cnbcool/cnb-cli 插件（CNB OpenAPI 命令行工具），一行命令完成分配：
  #   - 流水线自动注入 CNB_TOKEN，无需手写鉴权
  #   - issue.open 事件自动注入 CNB_REPO_SLUG / CNB_ISSUE_IID，cnb 会识别快捷上下文
  #   参考 https://cnb.cool/cnb/plugins/cnbcool/cnb-cli
  issue.open:
    - name: auto-assign-issue-owner
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          image: cnbcool/cnb-cli
          script: |
            set -e
            cnb issues add-assignees --assignees $ISSUE_ASSIGNEE

  # Tag 发布：编译产物 + 创建 Release + 上传附件（v* tag 触发）
  tag_push:
    - name: release-sduthesis
      docker:
        image: texlive/texlive:latest
      stages:
        - name: generate cls from dtx
          script: |
            set -e
            cd src && xelatex -interaction=nonstopmode sduthesis.ins
            cp sduthesis.cls ../sduthesis.cls
        - name: build pdf
          script: |
            set -e
            export TEXINPUTS=".:modules//:"
            # 等价 just build：xelatex x3 + biber
            xelatex -synctex=1 -interaction=nonstopmode -halt-on-error main.tex
            biber main
            xelatex -synctex=1 -interaction=nonstopmode -halt-on-error main.tex
            xelatex -synctex=1 -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
        - name: build documentation
          script: |
            set -e
            cd src && xelatex -interaction=nonstopmode sduthesis.dtx
            xelatex -interaction=nonstopmode sduthesis.dtx
            cp sduthesis.pdf ../sduthesis-doc.pdf
            test -s ../sduthesis-doc.pdf
        - name: build tds archive
          script: |
            set -e
            python3 - <<'PYEOF'
            import shutil, zipfile, os
            base = "/tmp/sduthesis-tds"
            for d in ["tex/latex/sduthesis", "doc/latex/sduthesis", "source/latex/sduthesis"]:
                os.makedirs(os.path.join(base, d), exist_ok=True)
            def cp(src, dst):
                shutil.copy(src, os.path.join(base, dst))
            cp("sduthesis.cls", "tex/latex/sduthesis/sduthesis.cls")
            import glob
            for f in glob.glob("modules/*.sty"):
                cp(f, "tex/latex/sduthesis/" + os.path.basename(f))
            cp("src/sduthesis.dtx", "source/latex/sduthesis/sduthesis.dtx")
            cp("src/sduthesis.ins", "source/latex/sduthesis/sduthesis.ins")
            cp("sduthesis-doc.pdf", "doc/latex/sduthesis/sduthesis-doc.pdf")
            cp("README.md", "doc/latex/sduthesis/README.md")
            with zipfile.ZipFile("sduthesis.tds.zip", "w", zipfile.ZIP_DEFLATED) as z:
                for root, _, files in os.walk(base):
                    for f in files:
                        p = os.path.join(root, f)
                        z.write(p, os.path.relpath(p, base))
            print("TDS built:", os.path.getsize("sduthesis.tds.zip"), "bytes")
            PYEOF
        - name: create zip archive
          script: |
            set -e
            python3 - <<'PYEOF'
            import os, glob, zipfile, shutil
            # 用户包：与 release.yml Create ZIP archive 步骤保持一致
            dst = "sduthesis"
            shutil.rmtree(dst, ignore_errors=True)
            os.makedirs(dst, exist_ok=True)
            for f in ["main.tex", "sdusetup.tex", "sduthesis.cls", "justfile",
                      "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]:
                if os.path.exists(f):
                    shutil.copy(f, os.path.join(dst, os.path.basename(f)))
            for d in ["modules", "data", "figures"]:
                if os.path.isdir(d):
                    shutil.copytree(d, os.path.join(dst, d))
            if os.path.exists("sduthesis-doc.pdf"):
                shutil.copy("sduthesis-doc.pdf", os.path.join(dst, "sduthesis-doc.pdf"))
            if os.path.exists("sduthesis.tds.zip"):
                shutil.copy("sduthesis.tds.zip", os.path.join(dst, "sduthesis.tds.zip"))
            with zipfile.ZipFile("sduthesis.zip", "w", zipfile.ZIP_DEFLATED) as z:
                for root, _, files in os.walk(dst):
                    for f in files:
                        p = os.path.join(root, f)
                        z.write(p, os.path.relpath(p, dst))
            print("User zip built:", os.path.getsize("sduthesis.zip"), "bytes")
            PYEOF
        - name: create release
          type: git:release
          options:
            descriptionFromFile: RELEASE_NOTES.md
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./main.pdf"
              - "./sduthesis.zip"
              - "./sduthesis.tds.zip"
              - "./sduthesis-doc.pdf"
