name: Build

# 构建 PDF 包：仅在 main 分支（代码相关改动）或手动触发时运行。
# 代码质量检查（lint + 编译回归）见 quality.yml，构建不再重复跑测试。
#
# 提速设计：
#   1. 路径过滤：仅代码改动触发（见下方 paths 注释，各 workflow 差异已说明）
#   2. concurrency：取消旧运行，不排队
#   3. TeX Live 由 install-texlive 默认自动缓存（~/texlive），跨 workflow 复用

on:
  push:
    branches: [main]
    # ⚠️ 本文件 paths 与 quality/sync-cnb 各自维护（GitHub Actions 不支持跨文件复用路径清单）。
    # 有意区别于 quality.yml：此处**不含** testfiles/**、tests/**、.chktexrc——
    # 这些是测试与 lint 配置，不影响 PDF 构建产物，改它们不应触发构建（由 quality.yml 覆盖）。
    # 与 sync-cnb.yml 的差异见该文件注释。改 paths 时请同步核对三个 workflow。
    paths:
      - 'src/**'
      - 'modules/**'
      - '*.cls'
      - '*.sty'
      - '*.dtx'
      - '*.ins'
      - '*.tex'
      - 'justfile'
      - '.github/tl_packages'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 双 TeX Live 版本矩阵：发布前验证旧版本兼容性（仅 main 分支低频运行，成本可控）。
    # PR 阶段的 lint/regression 保持单版本(最新)以提速，兼容性信号由本矩阵兜底。
    # 注意：显式指定 repository 时，安装版本由该 repository 决定（texlive_version 仅作缓存 key），
    #       因此每个矩阵项必须显式提供与版本匹配的镜像地址，避免旧 CI「矩阵无效、全装当前版」的问题。
    name: Build PDF (TeX Live ${{ matrix.texlive_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - texlive_version: 2026
            repository: https://mirrors.mit.edu/CTAN/systems/texlive/tlnet/
          - texlive_version: 2025
            repository: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/tlnet-final/
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX Live ${{ matrix.texlive_version }}
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          texlive_version: ${{ matrix.texlive_version }}
          repository: ${{ matrix.repository }}

      - name: Link fonts for XeTeX
        run: |
          mkdir -p ~/.fonts
          ln -s $(kpsewhich -var-value=TEXMFDIST)/fonts/ ~/.fonts/texmf-dist-fonts

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Generate cls from DTX
        run: |
          cd src && xelatex sduthesis.ins
          cp sduthesis.cls ../sduthesis.cls

      - name: Build PDF
        run: just build
        env:
          TEXINPUTS: ".:modules//:"

      - name: Verify PDF
        run: |
          test -s main.pdf
          echo "main.pdf 生成成功 ($(stat -c%s main.pdf) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: main.pdf (TeX Live ${{ matrix.texlive_version }})
          path: main.pdf
          if-no-files-found: error
