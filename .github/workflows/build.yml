name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build (TeX Live 2025)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          texlive_version: 2025

      - name: Link fonts for XeTeX
        run: |
          mkdir -p ~/.fonts
          ln -s $(kpsewhich -var-value=TEXMFDIST)/fonts/ ~/.fonts/texmf-dist-fonts

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Generate cls from DTX
        run: |
          cd src && xelatex sduthesis.ins
          cp sduthesis.cls ../sduthesis.cls

      - name: Lint with chktex
        continue-on-error: true
        run: |
          chktex -q -n 1 -n 13 -n 24 -n 36 sduthesis.cls modules/*.sty 2>/dev/null || true

      - name: Build PDF
        run: just build
        env:
          TEXINPUTS: ".:modules//:"

      - name: Run compile tests
        run: python3 tests/test-compile.py
        env:
          TEXINPUTS: ".:modules//:"

      - name: l3build regression check
        continue-on-error: true
        run: |
          # 首次运行：生成 tlg 基线（仓库无 tlg 时 check 会失败，改用 save 生成）
          if [ ! -f testfiles/cover.tlg ]; then
            l3build save --quiet 2>&1 | tail -20
            echo "tlg 基线已生成，请从 artifact 下载并提交到仓库"
          else
            l3build check --quiet 2>&1 | tail -40
          fi
        env:
          TEXINPUTS: ".:modules//:"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: main.pdf
          path: main.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: l3build-tlg
          path: testfiles/*.tlg
          if-no-files-found: warn
