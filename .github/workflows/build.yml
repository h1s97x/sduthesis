name: Build

# 构建 PDF 包：仅在 main 分支（代码相关改动）或手动触发时运行。
# 代码质量检查（lint + 编译回归）见 quality.yml，构建不再重复跑测试。
#
# 提速设计：
#   1. 路径过滤：testfiles/tests 等测试改动不触发构建
#   2. concurrency：取消旧运行，不排队
#   3. TeX Live 由 install-texlive 默认自动缓存（~/texlive），跨 workflow 复用

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'modules/**'
      - '*.cls'
      - '*.sty'
      - '*.dtx'
      - '*.ins'
      - '*.tex'
      - 'justfile'
      - '.github/tl_packages'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 双 TeX Live 版本矩阵：发布前验证旧版本兼容性（仅 main 分支低频运行，成本可控）。
    # PR 阶段的 lint/regression 保持单版本(2025)以提速，兼容性信号由本矩阵兜底。
    name: Build PDF (TeX Live ${{ matrix.texlive }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        texlive: [2024, 2025]
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX Live ${{ matrix.texlive }}
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          texlive_version: ${{ matrix.texlive }}
          repository: https://mirror.ctan.org/systems/texlive/tlnet

      - name: Link fonts for XeTeX
        run: |
          mkdir -p ~/.fonts
          ln -s $(kpsewhich -var-value=TEXMFDIST)/fonts/ ~/.fonts/texmf-dist-fonts

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Generate cls from DTX
        run: |
          cd src && xelatex sduthesis.ins
          cp sduthesis.cls ../sduthesis.cls

      - name: Build PDF
        run: just build
        env:
          TEXINPUTS: ".:modules//:"

      - name: Verify PDF
        run: |
          test -s main.pdf
          echo "main.pdf 生成成功 ($(stat -c%s main.pdf) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: main.pdf (TeX Live ${{ matrix.texlive }})
          path: main.pdf
          if-no-files-found: error
