name: Release

# 发布流水线：打 tag（v*）或手动触发时运行。
#
# ⚠️ 本 workflow 会在 release 时回写 CHANGELOG.md 并 push。
# 请勿把 CHANGELOG.md 加入 build.yml / quality.yml / sync-cnb.yml 的触发 paths
# （它不在其中即不会连锁触发 CI）。若后续为 build/sync 新增 paths 时，务必仍保持
# CHANGELOG.md 不被触发，否则 release 的 CHANGELOG push 会再次拉起构建，形成连锁。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      - name: Link fonts for XeTeX
        run: |
          mkdir -p ~/.fonts
          ln -s $(kpsewhich -var-value=TEXMFDIST)/fonts/ ~/.fonts/texmf-dist-fonts

      - uses: taiki-e/install-action@v2
        with:
          tool: just, git-cliff

      - name: Generate cls from DTX
        run: |
          cd src && xelatex sduthesis.ins
          cp sduthesis.cls ../sduthesis.cls

      - name: Build PDF
        run: just build
        env:
          TEXINPUTS: ".:modules//:"

      - name: Build documentation
        run: just doc
        env:
          TEXINPUTS: ".:modules//:"

      - name: Generate changelog
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Update changelog
        # ⚠️ 此步会 push CHANGELOG.md（[skip ci]）。
        # 必须确保 CHANGELOG.md 不在 build.yml / quality.yml / sync-cnb.yml 的触发 paths 中
        # （当前各 workflow 均不含它，故不连锁触发 CI）；新增 paths 时勿把 CHANGELOG.md 加进去。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CHANGELOG.md [skip ci]"
            git push
          fi

      - name: Create ZIP archive
        run: |
          mkdir -p sduthesis
          cp main.tex sdusetup.tex sduthesis/
          cp sduthesis.cls sduthesis/
          cp -r modules/ data/ figures/ sduthesis/
          cp justfile README.md LICENSE CHANGELOG.md CONTRIBUTING.md sduthesis/
          cp sduthesis-doc.pdf sduthesis/ 2>/dev/null || true
          zip -r sduthesis.zip sduthesis/
          rm -rf sduthesis/

      - name: Create TDS archive
        run: just tds

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.pdf
            sduthesis.zip
            sduthesis.tds.zip
            sduthesis-doc.pdf
          generate_release_notes: true
